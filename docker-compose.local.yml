services:
  postgres:
    image: postgres:15
    container_name: tg_bot_postgres
    env_file:
      - .env
    ports:
      - "5433:5432" # чтобы не конфликтовать с локальным postgres на 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tg_bot_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_bot_user -d tg_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: kvt-bot
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # environment variables are in .env
    networks:
      - tg_bot_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  tg_bot_network:
    driver: bridge


